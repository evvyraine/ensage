name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ensage
          POSTGRES_USER: ensage
          POSTGRES_PASSWORD: ensage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ensage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ensage:ensage@localhost:5432/ensage
      TEST_DATABASE_URL: postgresql://ensage:ensage@localhost:5432/ensage
      CLERK_SECRET_KEY: sk_test_ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC1jaS5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
